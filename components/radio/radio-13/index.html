<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio 13</title>
  <link rel="stylesheet" href="style.css">
  <style> body { padding: 40px; display: flex; justify-content: center; background-color: #f8fafc; } </style>
</head>
<body>
  <div class="rad-group">
    <label class="rad-item">
      <input type="radio" name="r13" class="rad-ctrl" checked />
      <div class="rad-pill">
        <div class="rad-icon"></div>
        <span class="rad-lbl">Songs</span>
      </div>
    </label>
    <label class="rad-item">
      <input type="radio" name="r13" class="rad-ctrl" />
      <div class="rad-pill">
        <div class="rad-icon"></div>
        <span class="rad-lbl">Podcasts</span>
      </div>
    </label>
  </div>
</body>
</html>
