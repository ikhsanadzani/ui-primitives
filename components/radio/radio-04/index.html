<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio 04</title>
  <link rel="stylesheet" href="style.css">
  <style> body { padding: 40px; display: flex; justify-content: center; background-color: #f8fafc; } </style>
</head>
<body>
  <div class="rad-group">
    <label class="rad-item">
      <input type="radio" name="r4" class="rad-ctrl" checked />
      <div class="rad-dot"></div>
      <div>
        <div class="rad-lbl">Personal</div>
        <div class="rad-desc">For individuals</div>
      </div>
    </label>
    <label class="rad-item">
      <input type="radio" name="r4" class="rad-ctrl" />
      <div class="rad-dot"></div>
      <div>
        <div class="rad-lbl">Team</div>
        <div class="rad-desc">Up to 10 users</div>
      </div>
    </label>
  </div>
</body>
</html>
