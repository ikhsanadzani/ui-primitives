<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio 01</title>
  <link rel="stylesheet" href="style.css">
  <style> body { padding: 40px; display: flex; justify-content: center; background-color: #f8fafc; } </style>
</head>
<body>
  <div class="rad-group">
    <label class="rad-item">
      <input type="radio" name="r1" class="rad-ctrl" checked />
      <span class="rad-dot"></span>
      <span class="rad-lbl">Standard</span>
    </label>
    <label class="rad-item">
      <input type="radio" name="r1" class="rad-ctrl" />
      <span class="rad-dot"></span>
      <span class="rad-lbl">Express</span>
    </label>
  </div>
</body>
</html>
