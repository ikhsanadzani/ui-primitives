<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio 12</title>
  <link rel="stylesheet" href="style.css">
  <style> body { padding: 40px; display: flex; justify-content: center; background-color: #f8fafc; } </style>
</head>
<body>
  <div class="rad-group">
    <label class="rad-item">
      <div class="rad-content">
        <div class="rad-lbl">Wi-Fi</div>
        <div class="rad-desc">Connected to Network</div>
      </div>
      <input type="radio" name="r12" class="rad-ctrl" checked />
      <div class="rad-dot"></div>
    </label>
    <label class="rad-item">
      <div class="rad-content">
        <div class="rad-lbl">Bluetooth</div>
        <div class="rad-desc">Disconnected</div>
      </div>
      <input type="radio" name="r12" class="rad-ctrl" />
      <div class="rad-dot"></div>
    </label>
  </div>
</body>
</html>
