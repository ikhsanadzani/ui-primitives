<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio 05</title>
  <link rel="stylesheet" href="style.css">
  <style> body { padding: 40px; display: flex; justify-content: center; background-color: #f8fafc; } </style>
</head>
<body>
  <div class="rad-group">
    <label class="rad-item">
      <input type="radio" name="r5" class="rad-ctrl" checked />
      <div class="rad-box"></div>
      <span class="rad-lbl">Dark Mode</span>
    </label>
    <label class="rad-item">
      <input type="radio" name="r5" class="rad-ctrl" />
      <div class="rad-box"></div>
      <span class="rad-lbl">Light Mode</span>
    </label>
  </div>
</body>
</html>
