<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio 07</title>
  <link rel="stylesheet" href="style.css">
  <style> body { padding: 40px; display: flex; justify-content: center; background-color: #f8fafc; } </style>
</head>
<body>
  <div class="rad-group">
    <label class="rad-item">
      <input type="radio" name="r7" class="rad-ctrl" checked />
      <div class="rad-card">
        <div class="rad-icon">🚀</div>
        <div class="rad-text">
          <div class="rad-lbl">Pro</div>
          <div class="rad-desc">$15/mo</div>
        </div>
        <div class="rad-dot"></div>
      </div>
    </label>
    <label class="rad-item">
      <input type="radio" name="r7" class="rad-ctrl" />
      <div class="rad-card">
        <div class="rad-icon">⚡</div>
        <div class="rad-text">
          <div class="rad-lbl">Max</div>
          <div class="rad-desc">$30/mo</div>
        </div>
        <div class="rad-dot"></div>
      </div>
    </label>
  </div>
</body>
</html>
