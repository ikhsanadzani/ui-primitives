<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio 09</title>
  <link rel="stylesheet" href="style.css">
  <style> body { padding: 40px; display: flex; justify-content: center; background-color: #f8fafc; } </style>
</head>
<body>
  <div class="rad-group">
    <label class="rad-item">
      <input type="radio" name="r9" class="rad-ctrl" />
      <div class="rad-card">
        <div class="rad-dot"></div>
        <div class="rad-lbl">Basic</div>
        <div class="rad-price">$9</div>
      </div>
    </label>
    <label class="rad-item">
      <input type="radio" name="r9" class="rad-ctrl" checked />
      <div class="rad-card">
        <div class="rad-dot"></div>
        <div class="rad-lbl">Pro</div>
        <div class="rad-price">$29</div>
      </div>
    </label>
  </div>
</body>
</html>
