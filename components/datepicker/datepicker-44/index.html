<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datepicker 44</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { padding: 40px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f8fafc; font-family: 'Geist', sans-serif; }
  </style>
</head>
<body>


<div class="dp-card">
  <input type="radio" name="dp44-tab" id="dp44-tab-m" class="dp-tab-ctrl" checked>
  <input type="radio" name="dp44-tab" id="dp44-tab-y" class="dp-tab-ctrl">
  
  <div class="dp-tabs">
    <label for="dp44-tab-m" class="dp-tab-lbl">Month</label>
    <label for="dp44-tab-y" class="dp-tab-lbl">Year</label>
  </div>
  
  <div class="dp-view dp-view-m" role="radiogroup" aria-label="Select month">
    <div class="dp-grid">
      <label class="dp-cell disabled"><input type="radio" class="dp-ctrl" name="dp44m" value="2026-01" id="dp44m-jan" disabled><span class="dp-lbl">Jan</span></label>
<label class="dp-cell disabled"><input type="radio" class="dp-ctrl" name="dp44m" value="2026-02" id="dp44m-feb" disabled><span class="dp-lbl">Feb</span></label>
<label class="dp-cell disabled"><input type="radio" class="dp-ctrl" name="dp44m" value="2026-03" id="dp44m-mar" disabled><span class="dp-lbl">Mar</span></label>
<label class="dp-cell disabled"><input type="radio" class="dp-ctrl" name="dp44m" value="2026-04" id="dp44m-apr" disabled><span class="dp-lbl">Apr</span></label>
<label class="dp-cell disabled"><input type="radio" class="dp-ctrl" name="dp44m" value="2026-05" id="dp44m-may" disabled><span class="dp-lbl">May</span></label>
<label class="dp-cell disabled"><input type="radio" class="dp-ctrl" name="dp44m" value="2026-06" id="dp44m-jun" disabled><span class="dp-lbl">Jun</span></label>
<label class="dp-cell disabled"><input type="radio" class="dp-ctrl" name="dp44m" value="2026-07" id="dp44m-jul" disabled><span class="dp-lbl">Jul</span></label>
<label class="dp-cell disabled"><input type="radio" class="dp-ctrl" name="dp44m" value="2026-08" id="dp44m-aug" disabled><span class="dp-lbl">Aug</span></label>
<label class="dp-cell disabled"><input type="radio" class="dp-ctrl" name="dp44m" value="2026-09" id="dp44m-sep" disabled><span class="dp-lbl">Sep</span></label>
<label class="dp-cell"><input type="radio" class="dp-ctrl" name="dp44m" value="2026-10" id="dp44m-oct" checked><span class="dp-lbl">Oct</span></label>
<label class="dp-cell"><input type="radio" class="dp-ctrl" name="dp44m" value="2026-11" id="dp44m-nov"><span class="dp-lbl">Nov</span></label>
<label class="dp-cell"><input type="radio" class="dp-ctrl" name="dp44m" value="2026-12" id="dp44m-dec"><span class="dp-lbl">Dec</span></label>

    </div>
  </div>
  
  <div class="dp-view dp-view-y" role="radiogroup" aria-label="Select year">
    <div class="dp-grid">
      <label class="dp-cell disabled"><input type="radio" class="dp-ctrl" name="dp44y" value="2020" id="dp44y-2020" disabled><span class="dp-lbl">2020</span></label>
<label class="dp-cell disabled"><input type="radio" class="dp-ctrl" name="dp44y" value="2021" id="dp44y-2021" disabled><span class="dp-lbl">2021</span></label>
<label class="dp-cell disabled"><input type="radio" class="dp-ctrl" name="dp44y" value="2022" id="dp44y-2022" disabled><span class="dp-lbl">2022</span></label>
<label class="dp-cell disabled"><input type="radio" class="dp-ctrl" name="dp44y" value="2023" id="dp44y-2023" disabled><span class="dp-lbl">2023</span></label>
<label class="dp-cell disabled"><input type="radio" class="dp-ctrl" name="dp44y" value="2024" id="dp44y-2024" disabled><span class="dp-lbl">2024</span></label>
<label class="dp-cell disabled"><input type="radio" class="dp-ctrl" name="dp44y" value="2025" id="dp44y-2025" disabled><span class="dp-lbl">2025</span></label>
<label class="dp-cell"><input type="radio" class="dp-ctrl" name="dp44y" value="2026" id="dp44y-2026" checked><span class="dp-lbl">2026</span></label>
<label class="dp-cell"><input type="radio" class="dp-ctrl" name="dp44y" value="2027" id="dp44y-2027"><span class="dp-lbl">2027</span></label>
<label class="dp-cell"><input type="radio" class="dp-ctrl" name="dp44y" value="2028" id="dp44y-2028"><span class="dp-lbl">2028</span></label>
<label class="dp-cell"><input type="radio" class="dp-ctrl" name="dp44y" value="2029" id="dp44y-2029"><span class="dp-lbl">2029</span></label>
<label class="dp-cell"><input type="radio" class="dp-ctrl" name="dp44y" value="2030" id="dp44y-2030"><span class="dp-lbl">2030</span></label>
<label class="dp-cell"><input type="radio" class="dp-ctrl" name="dp44y" value="2031" id="dp44y-2031"><span class="dp-lbl">2031</span></label>

    </div>
  </div>
</div>


</body>
</html>
