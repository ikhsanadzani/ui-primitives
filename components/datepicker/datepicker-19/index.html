<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datepicker 19</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { padding: 40px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f8fafc; font-family: 'Geist', sans-serif; }
  </style>
</head>
<body>

<fieldset class="dp-wrap">
  <legend class="dp-lbl">Valid Thru</legend>
  <div class="dp-box">
    <select class="dp-sel" aria-label="Expiration Month" id="dp19-m">
      <option value="" disabled selected>MM</option>
      <option value="1">01</option><option value="2">02</option>
    </select>
    <div class="dp-sep">/</div>
    <select class="dp-sel" aria-label="Expiration Year" id="dp19-y">
      <option value="" disabled selected>YY</option>
      <option value="26">26</option><option value="27">27</option>
    </select>
  </div>
</fieldset>

</body>
</html>
