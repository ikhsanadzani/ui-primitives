<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datepicker 39</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { padding: 40px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f8fafc; font-family: 'Geist', sans-serif; }
  </style>
</head>
<body>

<div class="dp-card dp-strip" role="radiogroup" aria-label="Select week day">
            <div class="dp-head">
                <button type="button" class="dp-nav">&lsaquo;</button>
                <div class="dp-title">October 2026</div>
                <button type="button" class="dp-nav">&rsaquo;</button>
            </div>
            <div class="dp-row">
                <label class="dp-day"><input type="radio" class="dp-ctrl" name="dp39" value="2026-10-12"><div class="dp-col"><span class="dp-dw">Mo</span><span class="dp-num">12</span></div></label>
                <label class="dp-day"><input type="radio" class="dp-ctrl" name="dp39" value="2026-10-13"><div class="dp-col"><span class="dp-dw">Tu</span><span class="dp-num">13</span></div></label>
                <label class="dp-day"><input type="radio" class="dp-ctrl" name="dp39" value="2026-10-14"><div class="dp-col"><span class="dp-dw">We</span><span class="dp-num">14</span></div></label>
                <label class="dp-day dp-today"><input type="radio" class="dp-ctrl" name="dp39" value="2026-10-15" checked><div class="dp-col"><span class="dp-dw">Th</span><span class="dp-num">15</span></div></label>
                <label class="dp-day"><input type="radio" class="dp-ctrl" name="dp39" value="2026-10-16"><div class="dp-col"><span class="dp-dw">Fr</span><span class="dp-num">16</span></div></label>
                <label class="dp-day"><input type="radio" class="dp-ctrl" name="dp39" value="2026-10-17"><div class="dp-col"><span class="dp-dw">Sa</span><span class="dp-num">17</span></div></label>
                <label class="dp-day"><input type="radio" class="dp-ctrl" name="dp39" value="2026-10-18"><div class="dp-col"><span class="dp-dw">Su</span><span class="dp-num">18</span></div></label>
            </div>
        </div>

</body>
</html>
