<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datepicker 45</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { padding: 40px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f8fafc; font-family: 'Geist', sans-serif; }
  </style>
</head>
<body>


<div class="dp-card" role="radiogroup" aria-label="Select time slot">
  <div class="dp-sec">
    <div class="dp-title">Morning</div>
    <div class="dp-grid">
      <label class="dp-cell"><input type="radio" class="dp-ctrl" name="dp45" value="09:00"><span class="dp-lbl">09:00</span></label>
      <label class="dp-cell"><input type="radio" class="dp-ctrl" name="dp45" value="09:30"><span class="dp-lbl">09:30</span></label>
      <label class="dp-cell"><input type="radio" class="dp-ctrl" name="dp45" value="10:00" checked><span class="dp-lbl">10:00</span></label>
      <label class="dp-cell disabled"><input type="radio" class="dp-ctrl" name="dp45" value="10:30" disabled><span class="dp-lbl">10:30</span></label>
      <label class="dp-cell"><input type="radio" class="dp-ctrl" name="dp45" value="11:00"><span class="dp-lbl">11:00</span></label>
      <label class="dp-cell"><input type="radio" class="dp-ctrl" name="dp45" value="11:30"><span class="dp-lbl">11:30</span></label>
    </div>
  </div>
  <div class="dp-sec">
    <div class="dp-title">Afternoon</div>
    <div class="dp-grid">
      <label class="dp-cell"><input type="radio" class="dp-ctrl" name="dp45" value="12:00"><span class="dp-lbl">12:00</span></label>
      <label class="dp-cell"><input type="radio" class="dp-ctrl" name="dp45" value="12:30"><span class="dp-lbl">12:30</span></label>
      <label class="dp-cell"><input type="radio" class="dp-ctrl" name="dp45" value="13:00"><span class="dp-lbl">13:00</span></label>
      <label class="dp-cell"><input type="radio" class="dp-ctrl" name="dp45" value="13:30"><span class="dp-lbl">13:30</span></label>
    </div>
  </div>
</div>


</body>
</html>
