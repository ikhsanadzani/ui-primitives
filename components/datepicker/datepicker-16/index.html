<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datepicker 16</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { padding: 40px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f8fafc; font-family: 'Geist', sans-serif; }
  </style>
</head>
<body>

<fieldset class="dp-wrap">
  <legend class="dp-lbl">Date of Birth</legend>
  <div class="dp-box">
    <select class="dp-sel" aria-label="Day" id="dp16-d">
      <option value="" disabled selected>DD</option>
      <option value="1">01</option><option value="2">02</option>
    </select>
    <div class="dp-div"></div>
    <select class="dp-sel" aria-label="Month" id="dp16-m">
      <option value="" disabled selected>MM</option>
      <option value="1">01</option><option value="2">02</option>
    </select>
    <div class="dp-div"></div>
    <select class="dp-sel" aria-label="Year" id="dp16-y">
      <option value="" disabled selected>YYYY</option>
      <option value="2026">2026</option>
    </select>
  </div>
</fieldset>

</body>
</html>
