<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datepicker 18</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { padding: 40px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f8fafc; font-family: 'Geist', sans-serif; }
  </style>
</head>
<body>

<fieldset class="dp-wrap">
  <legend class="dp-lbl">Enter Date (DDMMYYYY)</legend>
  <div class="dp-box">
    <div class="dp-grp">
      <input type="text" inputmode="numeric" maxlength="1" class="dp-inp" aria-label="Day digit 1">
      <input type="text" inputmode="numeric" maxlength="1" class="dp-inp" aria-label="Day digit 2">
    </div>
    <div class="dp-grp">
      <input type="text" inputmode="numeric" maxlength="1" class="dp-inp" aria-label="Month digit 1">
      <input type="text" inputmode="numeric" maxlength="1" class="dp-inp" aria-label="Month digit 2">
    </div>
    <div class="dp-grp">
      <input type="text" inputmode="numeric" maxlength="1" class="dp-inp" aria-label="Year digit 1">
      <input type="text" inputmode="numeric" maxlength="1" class="dp-inp" aria-label="Year digit 2">
      <input type="text" inputmode="numeric" maxlength="1" class="dp-inp" aria-label="Year digit 3">
      <input type="text" inputmode="numeric" maxlength="1" class="dp-inp" aria-label="Year digit 4">
    </div>
  </div>
</fieldset>

</body>
</html>
