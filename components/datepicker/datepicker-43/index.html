<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datepicker 43</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { padding: 40px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f8fafc; font-family: 'Geist', sans-serif; }
  </style>
</head>
<body>


<div class="dp-card" role="radiogroup" aria-label="Select year">
  <div class="dp-head">
    <button type="button" class="dp-nav">&lsaquo;</button>
    <div class="dp-title">2020 - 2031</div>
    <button type="button" class="dp-nav">&rsaquo;</button>
  </div>
  <div class="dp-grid">
    <label class="dp-cell disabled"><input type="radio" class="dp-ctrl" name="dp43" value="2020" id="dp43-2020" disabled><span class="dp-lbl">2020</span></label>
<label class="dp-cell disabled"><input type="radio" class="dp-ctrl" name="dp43" value="2021" id="dp43-2021" disabled><span class="dp-lbl">2021</span></label>
<label class="dp-cell disabled"><input type="radio" class="dp-ctrl" name="dp43" value="2022" id="dp43-2022" disabled><span class="dp-lbl">2022</span></label>
<label class="dp-cell disabled"><input type="radio" class="dp-ctrl" name="dp43" value="2023" id="dp43-2023" disabled><span class="dp-lbl">2023</span></label>
<label class="dp-cell disabled"><input type="radio" class="dp-ctrl" name="dp43" value="2024" id="dp43-2024" disabled><span class="dp-lbl">2024</span></label>
<label class="dp-cell disabled"><input type="radio" class="dp-ctrl" name="dp43" value="2025" id="dp43-2025" disabled><span class="dp-lbl">2025</span></label>
<label class="dp-cell"><input type="radio" class="dp-ctrl" name="dp43" value="2026" id="dp43-2026" checked><span class="dp-lbl">2026</span></label>
<label class="dp-cell"><input type="radio" class="dp-ctrl" name="dp43" value="2027" id="dp43-2027"><span class="dp-lbl">2027</span></label>
<label class="dp-cell"><input type="radio" class="dp-ctrl" name="dp43" value="2028" id="dp43-2028"><span class="dp-lbl">2028</span></label>
<label class="dp-cell"><input type="radio" class="dp-ctrl" name="dp43" value="2029" id="dp43-2029"><span class="dp-lbl">2029</span></label>
<label class="dp-cell"><input type="radio" class="dp-ctrl" name="dp43" value="2030" id="dp43-2030"><span class="dp-lbl">2030</span></label>
<label class="dp-cell"><input type="radio" class="dp-ctrl" name="dp43" value="2031" id="dp43-2031"><span class="dp-lbl">2031</span></label>

  </div>
</div>


</body>
</html>
