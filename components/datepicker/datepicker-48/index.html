<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datepicker 48</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { padding: 40px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f8fafc; font-family: 'Geist', sans-serif; }
  </style>
</head>
<body>


<div class="dp-wrap" role="radiogroup" aria-label="Select duration">
  <div class="dp-lbl-main">Duration</div>
  <div class="dp-seg">
    <label class="dp-opt"><input type="radio" class="dp-ctrl" name="dp48" value="15"><span class="dp-val">15m</span></label>
    <label class="dp-opt"><input type="radio" class="dp-ctrl" name="dp48" value="30" checked><span class="dp-val">30m</span></label>
    <label class="dp-opt"><input type="radio" class="dp-ctrl" name="dp48" value="45"><span class="dp-val">45m</span></label>
    <label class="dp-opt"><input type="radio" class="dp-ctrl" name="dp48" value="60"><span class="dp-val">1h</span></label>
  </div>
</div>


</body>
</html>
