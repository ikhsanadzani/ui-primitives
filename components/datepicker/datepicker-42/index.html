<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datepicker 42</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { padding: 40px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f8fafc; font-family: 'Geist', sans-serif; }
  </style>
</head>
<body>


<div class="dp-card" role="radiogroup" aria-label="Select month">
  <div class="dp-head">
    <button type="button" class="dp-nav">&lsaquo;</button>
    <div class="dp-title">2026</div>
    <button type="button" class="dp-nav">&rsaquo;</button>
  </div>
  <div class="dp-grid">
    <label class="dp-cell disabled"><input type="radio" class="dp-ctrl" name="dp42" value="2026-01" id="dp42-jan" disabled><span class="dp-lbl">Jan</span></label>
<label class="dp-cell disabled"><input type="radio" class="dp-ctrl" name="dp42" value="2026-02" id="dp42-feb" disabled><span class="dp-lbl">Feb</span></label>
<label class="dp-cell disabled"><input type="radio" class="dp-ctrl" name="dp42" value="2026-03" id="dp42-mar" disabled><span class="dp-lbl">Mar</span></label>
<label class="dp-cell disabled"><input type="radio" class="dp-ctrl" name="dp42" value="2026-04" id="dp42-apr" disabled><span class="dp-lbl">Apr</span></label>
<label class="dp-cell disabled"><input type="radio" class="dp-ctrl" name="dp42" value="2026-05" id="dp42-may" disabled><span class="dp-lbl">May</span></label>
<label class="dp-cell disabled"><input type="radio" class="dp-ctrl" name="dp42" value="2026-06" id="dp42-jun" disabled><span class="dp-lbl">Jun</span></label>
<label class="dp-cell disabled"><input type="radio" class="dp-ctrl" name="dp42" value="2026-07" id="dp42-jul" disabled><span class="dp-lbl">Jul</span></label>
<label class="dp-cell disabled"><input type="radio" class="dp-ctrl" name="dp42" value="2026-08" id="dp42-aug" disabled><span class="dp-lbl">Aug</span></label>
<label class="dp-cell disabled"><input type="radio" class="dp-ctrl" name="dp42" value="2026-09" id="dp42-sep" disabled><span class="dp-lbl">Sep</span></label>
<label class="dp-cell"><input type="radio" class="dp-ctrl" name="dp42" value="2026-10" id="dp42-oct" checked><span class="dp-lbl">Oct</span></label>
<label class="dp-cell"><input type="radio" class="dp-ctrl" name="dp42" value="2026-11" id="dp42-nov"><span class="dp-lbl">Nov</span></label>
<label class="dp-cell"><input type="radio" class="dp-ctrl" name="dp42" value="2026-12" id="dp42-dec"><span class="dp-lbl">Dec</span></label>

  </div>
</div>


</body>
</html>
