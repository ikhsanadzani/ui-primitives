<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datepicker 17</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { padding: 40px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f8fafc; font-family: 'Geist', sans-serif; }
  </style>
</head>
<body>

<fieldset class="dp-wrap">
  <legend class="dp-lbl">Anniversary</legend>
  <div class="dp-box">
    <input type="text" inputmode="numeric" maxlength="2" pattern="[0-9]*" class="dp-inp dp-w2" placeholder="DD" aria-label="Day" id="dp17-d">
    <span class="dp-sep">/</span>
    <input type="text" inputmode="numeric" maxlength="2" pattern="[0-9]*" class="dp-inp dp-w2" placeholder="MM" aria-label="Month" id="dp17-m">
    <span class="dp-sep">/</span>
    <input type="text" inputmode="numeric" maxlength="4" pattern="[0-9]*" class="dp-inp dp-w4" placeholder="YYYY" aria-label="Year" id="dp17-y">
  </div>
</fieldset>

</body>
</html>
