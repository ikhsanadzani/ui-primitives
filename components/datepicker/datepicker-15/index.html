<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datepicker 15</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { padding: 40px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f8fafc; font-family: 'Geist', sans-serif; }
  </style>
</head>
<body>

<div class="dp-wrap">
  <label class="dp-lbl" for="dp15-input">Booking Date</label>
  <div class="dp-box">
    <input type="date" class="dp-input" id="dp15-input" min="2026-10-10" max="2026-10-20" value="2026-10-25">
  </div>
  <div class="dp-msg">Select a date between Oct 10 and Oct 20</div>
</div>

</body>
</html>
