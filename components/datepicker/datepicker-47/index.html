<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datepicker 47</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { padding: 40px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f8fafc; font-family: 'Geist', sans-serif; }
  </style>
</head>
<body>


<div class="dp-wrap" role="group" aria-label="Select days of week">
  <div class="dp-lbl-main">Repeat on</div>
  <div class="dp-days">
    <label class="dp-day"><input type="checkbox" class="dp-ctrl" name="days[]" value="Mo" checked><span class="dp-circle">M</span></label>
    <label class="dp-day"><input type="checkbox" class="dp-ctrl" name="days[]" value="Tu"><span class="dp-circle">T</span></label>
    <label class="dp-day"><input type="checkbox" class="dp-ctrl" name="days[]" value="We" checked><span class="dp-circle">W</span></label>
    <label class="dp-day"><input type="checkbox" class="dp-ctrl" name="days[]" value="Th"><span class="dp-circle">T</span></label>
    <label class="dp-day"><input type="checkbox" class="dp-ctrl" name="days[]" value="Fr" checked><span class="dp-circle">F</span></label>
    <label class="dp-day"><input type="checkbox" class="dp-ctrl" name="days[]" value="Sa"><span class="dp-circle">S</span></label>
    <label class="dp-day"><input type="checkbox" class="dp-ctrl" name="days[]" value="Su"><span class="dp-circle">S</span></label>
  </div>
</div>


</body>
</html>
