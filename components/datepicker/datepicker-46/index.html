<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datepicker 46</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { padding: 40px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f8fafc; font-family: 'Geist', sans-serif; }
  </style>
</head>
<body>


<div class="dp-list" role="radiogroup" aria-label="Select appointment time">
  <label class="dp-row"><input type="radio" class="dp-ctrl" name="dp46" value="14:00"><div class="dp-cnt"><span class="dp-tm">14:00</span><span class="dp-st">Available</span></div></label>
  <label class="dp-row"><input type="radio" class="dp-ctrl" name="dp46" value="14:30" checked><div class="dp-cnt"><span class="dp-tm">14:30</span><span class="dp-st">Available</span></div></label>
  <label class="dp-row disabled"><input type="radio" class="dp-ctrl" name="dp46" value="15:00" disabled><div class="dp-cnt"><span class="dp-tm">15:00</span><span class="dp-st">Booked</span></div></label>
  <label class="dp-row"><input type="radio" class="dp-ctrl" name="dp46" value="15:30"><div class="dp-cnt"><span class="dp-tm">15:30</span><span class="dp-st">Available</span></div></label>
</div>


</body>
</html>
