<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Datepicker 09</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { padding: 40px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #f8fafc; font-family: 'Geist', sans-serif; }
  </style>
</head>
<body>

<fieldset class="dp-wrap">
  <legend class="dp-lbl">Date Range</legend>
  <div class="dp-box">
    <input type="date" class="dp-input" aria-label="Start date" id="dp09-start">
    <div class="dp-sep"></div>
    <input type="date" class="dp-input" aria-label="End date" id="dp09-end">
  </div>
</fieldset>

</body>
</html>
