<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input 49</title>
  <link rel="stylesheet" href="style.css">
  <style> body { padding: 40px; display: flex; justify-content: center; background-color: #f8fafc; } </style>
</head>
<body>

<div class="inp-wrap">
  <div class="inp-group">
    <div class="inp-box">
      <label class="inp-lbl" for="inp-49-x">X</label>
      <input type="number" id="inp-49-x" placeholder="0" autocomplete="off" />
    </div>
    <div class="inp-divider"></div>
    <div class="inp-box">
      <label class="inp-lbl" for="inp-49-y">Y</label>
      <input type="number" id="inp-49-y" placeholder="0" autocomplete="off" />
    </div>
  </div>
</div>


</body>
</html>
